---
name: Sync

on:
  schedule:
    - cron: 0 0 * * 5
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7 # zizmor: ignore[artipacked] main.js pushes the new tags
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: yusoltsev
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sync and publish new tags
        run: bun main.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
